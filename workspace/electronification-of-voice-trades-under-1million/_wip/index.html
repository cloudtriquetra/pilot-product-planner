<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Trade Electronification | Under $1M</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e1e5eb;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e1e5eb;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }

        select {
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            color: #0f1419;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(74, 222, 128, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e1e5eb;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .trade-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .trade-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .trade-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .trade-id {
            font-size: 12px;
            color: #6b7280;
        }

        .trade-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .detail-item {
            font-size: 13px;
        }

        .detail-label {
            color: #9ca3af;
            margin-right: 5px;
        }

        .detail-value {
            color: #e1e5eb;
            font-weight: 500;
        }

        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }

        .status-confirmed {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }

        .summary-panel {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.05), rgba(34, 211, 238, 0.05));
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #4ade80, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .summary-label {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .voice-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .trade-amount {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: #e1e5eb;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #4ade80;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(74, 222, 128, 0.9);
            color: #0f1419;
            border-radius: 6px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice Trade Electronification</h1>
            <div class="subtitle">Process voice trades under $1 million | Real-time validation & confirmation</div>
        </header>

        <div class="main-grid">
            <!-- Trade Entry Panel -->
            <div class="panel">
                <div class="panel-title">
                    <span>Trade Entry</span>
                    <span class="voice-indicator">
                        <span class="pulse"></span>
                        Voice Trade
                    </span>
                </div>

                <form id="tradeForm">
                    <div class="quick-actions">
                        <button type="button" class="quick-btn" onclick="setTradeType('BUY')">Quick Buy</button>
                        <button type="button" class="quick-btn" onclick="setTradeType('SELL')">Quick Sell</button>
                        <button type="button" class="quick-btn" onclick="setInstrument('EQUITY')">Equity</button>
                        <button type="button" class="quick-btn" onclick="setInstrument('BOND')">Bond</button>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Trade Type *</label>
                            <select id="tradeType" required>
                                <option value="">Select Type</option>
                                <option value="BUY">Buy</option>
                                <option value="SELL">Sell</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Instrument *</label>
                            <select id="instrument" required>
                                <option value="">Select Instrument</option>
                                <option value="EQUITY">Equity</option>
                                <option value="BOND">Bond</option>
                                <option value="FX">FX</option>
                                <option value="COMMODITY">Commodity</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Symbol/Ticker *</label>
                        <input type="text" id="symbol" placeholder="e.g., AAPL, MSFT" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Quantity *</label>
                            <input type="number" id="quantity" placeholder="Number of shares" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>Price (USD) *</label>
                            <input type="number" id="price" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Counterparty *</label>
                        <input type="text" id="counterparty" placeholder="Counterparty name" required>
                    </div>

                    <div class="form-group">
                        <label>Trader Name *</label>
                        <input type="text" id="trader" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label>Voice Notes</label>
                        <textarea id="notes" placeholder="Additional details from voice trade..."></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <span>⚡</span>
                            Process Trade
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="clearForm()">
                            Clear
                        </button>
                    </div>
                </form>
            </div>

            <!-- Trade List Panel -->
            <div class="panel">
                <div class="panel-title">
                    <span>Recent Trades</span>
                    <span class="badge" id="tradeCount">0 trades</span>
                </div>

                <div class="trade-list" id="tradeList">
                    <div class="empty-state">
                        No trades recorded yet. Submit your first trade to begin.
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Panel -->
        <div class="panel summary-panel">
            <div class="panel-title">
                Today's Summary
            </div>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-value" id="totalTrades">0</div>
                    <div class="summary-label">Total Trades</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="totalVolume">$0</div>
                    <div class="summary-label">Total Volume</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="avgSize">$0</div>
                    <div class="summary-label">Average Size</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Trade storage
        let trades = [];
        let tradeIdCounter = 1000;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadTrades();
            updateSummary();
        });

        // Form submission
        document.getElementById('tradeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const trade = {
                id: `VT${tradeIdCounter++}`,
                timestamp: new Date().toISOString(),
                type: document.getElementById('tradeType').value,
                instrument: document.getElementById('instrument').value,
                symbol: document.getElementById('symbol').value.toUpperCase(),
                quantity: parseInt(document.getElementById('quantity').value),
                price: parseFloat(document.getElementById('price').value),
                counterparty: document.getElementById('counterparty').value,
                trader: document.getElementById('trader').value,
                notes: document.getElementById('notes').value,
                status: 'pending',
                voiceTrade: true
            };

            // Calculate total
            trade.total = trade.quantity * trade.price;

            // Validate under $1M
            if (trade.total >= 1000000) {
                showToast('Trade exceeds $1M limit. Please use standard process.', 'error');
                return;
            }

            // Add trade
            trades.unshift(trade);
            saveTrades();
            renderTrades();
            updateSummary();
            clearForm();
            
            // Show success
            showToast(`Trade ${trade.id} processed successfully!`);
            
            // Auto-confirm after 2 seconds (simulating backend confirmation)
            setTimeout(() => {
                trade.status = 'confirmed';
                saveTrades();
                renderTrades();
            }, 2000);
        });

        // Render trades
        function renderTrades() {
            const container = document.getElementById('tradeList');
            
            if (trades.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        No trades recorded yet. Submit your first trade to begin.
                    </div>
                `;
                document.getElementById('tradeCount').textContent = '0 trades';
                return;
            }

            document.getElementById('tradeCount').textContent = `${trades.length} trades`;
            
            container.innerHTML = trades.map(trade => `
                <div class="trade-item" onclick="viewTrade('${trade.id}')">
                    <div class="trade-header">
                        <div>
                            <strong>${trade.type}</strong> ${trade.symbol}
                            <span class="trade-id">${trade.id}</span>
                        </div>
                        <span class="status status-${trade.status}">${trade.status}</span>
                    </div>
                    <div class="trade-amount">$${formatNumber(trade.total)}</div>
                    <div class="trade-details">
                        <div class="detail-item">
                            <span class="detail-label">Qty:</span>
                            <span class="detail-value">${formatNumber(trade.quantity)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Price:</span>
                            <span class="detail-value">$${trade.price.toFixed(2)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Trader:</span>
                            <span class="detail-value">${trade.trader}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Time:</span>
                            <span class="detail-value">${formatTime(trade.timestamp)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Update summary
        function updateSummary() {
            const totalTrades = trades.length;
            const totalVolume = trades.reduce((sum, t) => sum + t.total, 0);
            const avgSize = totalTrades > 0 ? totalVolume / totalTrades : 0;

            document.getElementById('totalTrades').textContent = totalTrades;
            document.getElementById('totalVolume').textContent = `$${formatNumber(totalVolume)}`;
            document.getElementById('avgSize').textContent = `$${formatNumber(avgSize)}`;
        }

        // Quick actions
        function setTradeType(type) {
            document.getElementById('tradeType').value = type;
        }

        function setInstrument(instrument) {
            document.getElementById('instrument').value = instrument;
        }

        // Clear form
        function clearForm() {
            document.getElementById('tradeForm').reset();
        }

        // View trade details
        function viewTrade(tradeId) {
            const trade = trades.find(t => t.id === tradeId);
            if (trade) {
                showToast(`Trade ${tradeId}: ${trade.type} ${trade.quantity} ${trade.symbol} @ $${trade.price}`);
            }
        }

        // Storage functions
        function saveTrades() {
            localStorage.setItem('voiceTrades', JSON.stringify(trades));
        }

        function loadTrades() {
            const stored = localStorage.getItem('voiceTrades');
            if (stored) {
                trades = JSON.parse(stored);
                // Update counter
                if (trades.length > 0) {
                    const lastId = trades[0].id.replace('VT', '');
                    tradeIdCounter = parseInt(lastId) + 1;
                }
                renderTrades();
            }
        }

        // Utility functions
        function formatNumber(num) {
            return num.toLocaleString('en-US', { maximumFractionDigits: 2 });
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            
            if (type === 'error') {
                toast.style.background = 'rgba(239, 68, 68, 0.9)';
            } else {
                toast.style.background = 'rgba(74, 222, 128, 0.9)';
            }
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + Enter to submit
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const form = document.getElementById('tradeForm');
                if (form.checkValidity()) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
            // Escape to clear form
            if (e.key === 'Escape') {
                clearForm();
            }
        });
    </script>
</body>
</html>
